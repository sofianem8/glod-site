<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Glöd — importer une séance</title>
<!--
  PAGE DE REBOND POUR LE PARTAGE DE SÉANCES

  Un schéma d'URL personnalisé (glod://) n'est reconnu comme lien par presque
  aucune messagerie : dans iMessage ou WhatsApp il s'affiche en texte gris
  inerte. Un https, lui, est cliquable partout. Cette page ne fait donc qu'une
  chose : rebondir vers l'app.

  ⚠️ LA CHARGE UTILE EST DANS LE FRAGMENT (#), JAMAIS DANS LA QUERY.
  Un fragment n'est pas transmis au serveur : le nom de la séance et la liste
  des exercices n'apparaissent dans AUCUN journal d'accès de l'hébergeur, et le
  script ci-dessous est le seul à les lire. C'est ce que promet la politique de
  confidentialité — ici c'est une propriété du format, pas une déclaration
  d'intention.

  Rien n'est envoyé nulle part : pas de requête, pas de mesure d'audience, pas
  de cookie.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0F0F12; color: #F2F2F4;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  main { max-width: 30rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: #9A9AA2; margin: .5rem 0; }
  .flame { font-size: 3rem; line-height: 1; margin-bottom: 1rem; }
  a.cta {
    display: inline-block; margin-top: 1.25rem; padding: .8rem 1.6rem;
    border-radius: 999px; text-decoration: none; font-weight: 600; color: #111;
    background: linear-gradient(135deg, #FF6B1A, #FFC043);
  }
  a.store { display: block; margin-top: 1rem; color: #FF8A3D; }
</style>
</head>
<body>
<main>
  <div class="flame">🔥</div>
  <h1 id="title">Ouverture de Glöd…</h1>
  <p id="sub">Si rien ne se passe, appuie sur le bouton ci-dessous.</p>
  <a class="cta" id="open" href="#">Ouvrir dans Glöd</a>
  <a class="store" href="https://apps.apple.com/app/id6752532096">Je n'ai pas encore l'app</a>
</main>
<script>
(function () {
  // Le fragment porte déjà « name=…&slugs=… » : on le recolle tel quel derrière
  // glod://import, sans le ré-encoder — il l'est déjà.
  var payload = window.location.hash.replace(/^#/, "");
  if (!payload) {
    document.getElementById("title").textContent = "Lien incomplet";
    document.getElementById("sub").textContent =
      "Ce lien ne contient aucune séance. Demande à ton contact de le renvoyer en entier.";
    document.getElementById("open").style.display = "none";
    return;
  }
  var deepLink = "glod://import?" + payload;
  document.getElementById("open").href = deepLink;
  // Tentative automatique. Sans redirection dure : si l'app n'est pas
  // installée, Safari afficherait une alerte d'erreur, et la page doit rester
  // lisible derrière.
  window.location.href = deepLink;
})();
</script>
</body>
</html>
